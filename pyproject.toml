[project]
name = "github-telegram-notifier"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.29.1",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.16.1",
    "ruff>=0.17.2",
    "sqlalchemy[asyncio]>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
